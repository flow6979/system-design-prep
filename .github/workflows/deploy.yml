name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # handbook repo can trigger a rebuild; a daily run picks up handbook changes otherwise
  repository_dispatch:
    types: [handbook-updated]
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # Agentic AI section: code + docs come from the handbook repo
      - name: Checkout agentic-ai-handbook
        uses: actions/checkout@v4
        with:
          repository: flow6979/agentic-ai-handbook
          path: handbook

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Check mermaid diagrams
        run: npm run check:mermaid
      - name: Bundle handbook (code + docs) for the Agentic AI labs
        run: node scripts/sync-handbook.mjs
        env:
          HANDBOOK_DIR: ../handbook
      - name: Smoke test every agent lab offline inside Pyodide
        run: node scripts/smoke-pyodide.mjs
      - name: Run every handbook project's main.py offline inside Pyodide
        run: node scripts/smoke-projects.mjs
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
